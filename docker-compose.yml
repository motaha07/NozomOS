services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./prisma/dev.db
      - AUTH_SECRET=${AUTH_SECRET:-change-me-in-production}
      - AUTH_URL=http://localhost:3000
    volumes:
      - db-data:/app/prisma
    restart: unless-stopped

volumes:
  db-data:
